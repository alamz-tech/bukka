[project]
name = "bukka-api"
version = "1.0.0"
description = "Bukka food ordering API"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bukka_api", "bukka_api.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
