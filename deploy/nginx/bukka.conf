# Bukka web server: serves the web app and proxies /api/ to the local API.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/bukka/web/dist;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API down -> friendly JSON instead of Nginx's default error page.
        error_page 502 503 504 = @kitchen_closed;
    }

    location @kitchen_closed {
        default_type application/json;
        return 502 '{"error": "kitchen_closed", "message": "The kitchen is closed for a moment. Please try again shortly."}';
    }
}
